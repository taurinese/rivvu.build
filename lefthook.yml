pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,json,md,css,yml,yaml}'
      run: pnpm prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx}'
      run: pnpm eslint --max-warnings=0 {staged_files}
pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
